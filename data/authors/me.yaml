bio: |
  Heng Yao is an Algorithm Expert based in Shanghai, China. His research
  focuses on recommender systems, computational advertising, and graph neural
  networks, with recent work on click-through rate (CTR) prediction and
  numerical feature representation.

  He received his Ph.D. in Computer Science and Technology from Tongji
  University in 2021, where his doctoral research on graph neural networks
  and bioinformatics applications was advised by Prof. Jihong Guan.
  Before joining Ant Group, he was a Senior Algorithm Engineer at Huawei.

